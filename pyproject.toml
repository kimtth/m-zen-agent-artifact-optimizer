[project]
name = "zen-less-in-out"
version = "0.0.1"
description = "Dataset-free optimization for GitHub Copilot customization artifacts."
readme = "README.md"
requires-python = ">=3.13"
# tiktoken is not optional: reported savings are denominated in tokens, so an
# estimated count would make the headline number an estimate too.
#
# github-copilot-sdk is the only route to Copilot's models -- there is no
# chat-completions endpoint for them -- so it is not optional either. It fetches a
# CLI runtime binary on first use: python -m copilot download-runtime
dependencies = [
    "dspy>=3.0",
    "tiktoken>=0.8",
    "github-copilot-sdk>=1.0.11",
    "pyyaml>=6.0",
]

[project.scripts]
zen = "zen.cli:main"

# Deterministic checks, multilingual judges, and the GEPA path are covered by
# scripted tests. `zen selfcheck` exercises core invariants without a model.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
